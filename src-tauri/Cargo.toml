[package]
name = "screenplay-studio"
version = "0.1.0"
description = "A local, offline screenplay writing tool: ideas -> premise -> outline -> scenes -> screenplay."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "screenplay-studio"
path = "src/main.rs"
